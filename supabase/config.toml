project_id = "paceboard"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "https://habhub.expo.app"
additional_redirect_urls = ["paceboard://**", "http://localhost:8081/**", "http://localhost:8090/**", "https://habhub.expo.app/**", "https://sethstar-habhub.expo.app/**", "https://sethstar-habhub--*.expo.app/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.delete-account]
# The function validates the bearer token with auth.getUser itself. Keeping
# gateway verification off also supports current publishable-key JWT formats.
verify_jwt = false

[functions.group-invite]
verify_jwt = false

[functions.send-push]
# The function performs membership authorization with auth.getUser.
verify_jwt = false

[functions.fatsecret-food-search]
# The function validates the bearer token with auth.getUser itself and keeps
# the FatSecret client secret exclusively in Supabase's server environment.
verify_jwt = false
